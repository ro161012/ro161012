name: Update contribution graph

on:
  push:
    branches: [main]
  schedule:
    # Public contribution data is refreshed near-real-time without a cross-repo PAT.
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    name: Render profile contribution graph
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Render current public contribution calendar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_LOGIN: ro161012
        run: python scripts/render_contributions.py

      - name: Commit changed graph
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/profile-heatmap-dark.svg assets/profile-heatmap-light.svg
          if git diff --cached --quiet; then
            echo "Contribution graph is already current."
          else
            git commit -m "chore: update contribution graph"
            git push
          fi
